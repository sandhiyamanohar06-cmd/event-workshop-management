<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin - EventHub</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>


    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">
            EventHub
        </div>


        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="events.html">
                    Events
                </a>
            </li>

            <li>
                <a href="admin.html">
                    Admin
                </a>
            </li>

        </ul>

    </nav>



    <!-- Admin Section -->

    <section class="featured">

        <h2>
            Event Management
        </h2>


        <div class="event-card">

            <h3>
                Add New Event
            </h3>


            <form id="eventForm">


                <!-- Event Name -->

                <label for="eventName">
                    Event Name
                </label>


                <input
                    type="text"
                    id="eventName"
                    placeholder="Enter event name">



                <!-- Event Date -->

                <label for="eventDate">
                    Event Date
                </label>


                <input
                    type="date"
                    id="eventDate">



                <!-- Event Time -->

                <label for="eventTime">
                    Event Time
                </label>


                <input
                    type="time"
                    id="eventTime">



                <!-- Event Location -->

                <label for="eventLocation">
                    Event Location
                </label>


                <input
                    type="text"
                    id="eventLocation"
                    placeholder="Enter event location">



                <!-- Event Category -->

                <label for="eventCategory">
                    Event Category
                </label>


                <select id="eventCategory">

                    <option value="">
                        Select Category
                    </option>

                    <option value="Workshop">
                        Workshop
                    </option>

                    <option value="Seminar">
                        Seminar
                    </option>

                    <option value="Career">
                        Career
                    </option>

                </select>



                <!-- Description -->

                <label for="eventDescription">
                    Description
                </label>


                <textarea
                    id="eventDescription"
                    rows="5"
                    placeholder="Enter event description">
                </textarea>



                <!-- Submit -->

                <button
                    type="submit"
                    class="hero-btn">

                    Add Event

                </button>


            </form>


            <p id="eventMessage"></p>


        </div>

    </section>



    <!-- Footer -->

    <footer>

        <p>
            © 2026 EventHub. All Rights Reserved.
        </p>

    </footer>



    <script src="js/script.js"></script>

</body>

</html>
